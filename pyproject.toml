[project]
name = "bilipy-bot"
version = "3.0.2"
description = "万物皆可 API / SDK 的机器人框架"
readme = "README.md"
authors = [{ name = "GEYUANwuqi", email = "wuqichan@outlook.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "bilibili-api-python>=17.4.2",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tqdm>=4.68.3",
]

# 清华源
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 开发依赖
[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]



[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes，未使用变量/导入等
    "I",  # import 排序
]
ignore = [
    "E501",   # 行长交给 ruff format
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
