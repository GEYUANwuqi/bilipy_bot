[project]
name = "butterbot-python"
version = "3.1.0"
description = "万物皆可 API / SDK 的机器人框架"
readme = "README.md"
authors = [{ name = "GEYUANwuqi", email = "wuqichan@outlook.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "packaging>=24",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
napcat = ["aiohttp>=3.14.1"]
bilibili = ["aiohttp>=3.14.1", "bilibili-api-python>=17.4.2"]
all = [
    "aiohttp>=3.14.1",
    "bilibili-api-python>=17.4.2",
    "lark-oapi>=1.7.2,<2",
]
lark = [
    "lark-oapi>=1.7.2,<2",
]

[project.scripts]
butterbot = "butterbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/GEYUANwuqi/ButterBot"
Repository = "https://github.com/GEYUANwuqi/ButterBot"
Issues = "https://github.com/GEYUANwuqi/ButterBot/issues"

[tool.hatch.build.targets.wheel]
packages = ["butterbot"]

# 开发依赖
[dependency-groups]
dev = [
    "aiohttp>=3.14.1",
    "bilibili-api-python>=17.4.2",
    "lark-oapi>=1.7.2,<2",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes，未使用变量/导入等
    "I",  # import 排序
]
ignore = [
    "E501",   # 行长交给 ruff format
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["butterbot", "tests"]
