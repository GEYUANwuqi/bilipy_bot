[project]
name = "butterbot-plugin-contract-handler"
version = "1.0.0"
description = "ButterBot external handler-only plugin contract fixture"
requires-python = ">=3.12"
dependencies = ["butterbot-python>=3.1.0.dev2"]

[project.entry-points."butterbot.plugins"]
"contract.handler" = "contract_handler:HandlerPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_handler"]
