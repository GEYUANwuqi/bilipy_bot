[project]
name = "butterbot-plugin-contract-source"
version = "1.0.0"
description = "ButterBot external source-only plugin contract fixture"
requires-python = ">=3.12"
dependencies = ["butterbot-python>=3.1.0.dev2"]

[project.entry-points."butterbot.plugins"]
"contract.source" = "contract_source:SourcePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_source"]
