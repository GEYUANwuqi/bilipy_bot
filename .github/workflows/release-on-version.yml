name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and branch
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin main dev_main --prune

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            REQUIRED_BRANCH="main"
            PRERELEASE="false"
            LATEST_FLAG="--latest"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            CHANNEL="dev"
            REQUIRED_BRANCH="dev_main"
            PRERELEASE="true"
            LATEST_FLAG="--latest=false"
          else
            echo "Invalid tag: $TAG"
            echo "Expected stable tag: v3.0.5"
            echo "Expected dev tag: v3.0.5-dev.1"
            exit 1
          fi

          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/${REQUIRED_BRANCH}$"; then
            echo "Tag $TAG is not on required branch: $REQUIRED_BRANCH"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "latest_flag=$LATEST_FLAG" >> "$GITHUB_OUTPUT"

      - name: Create stable GitHub Release
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          LATEST_FLAG: ${{ steps.meta.outputs.latest_flag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag \
            $LATEST_FLAG

      - name: Create dev GitHub Prerelease
        if: steps.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          LATEST_FLAG: ${{ steps.meta.outputs.latest_flag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag \
            --prerelease \
            $LATEST_FLAG
