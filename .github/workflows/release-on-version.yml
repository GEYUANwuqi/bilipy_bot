name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev --python "3.12"

      - name: Validate tag and branch
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin main dev_main --prune

          PROJECT_VERSION="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PROJECT_NAME="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          if [[ "$PROJECT_NAME" != "butterbot-python" ]]; then
            echo "Project name $PROJECT_NAME does not match expected package name butterbot-python"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match project version $PROJECT_VERSION"
            exit 1
          fi

          if [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            REQUIRED_BRANCH="main"
            PRERELEASE="false"
          elif [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            CHANNEL="dev"
            REQUIRED_BRANCH="dev_main"
            PRERELEASE="true"
          else
            echo "Invalid project version: $PROJECT_VERSION"
            echo "Expected stable tag: v3.0.5"
            echo "Expected dev tag: v3.0.5.dev1"
            exit 1
          fi

          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/${REQUIRED_BRANCH}$"; then
            echo "Tag $TAG is not on required branch: $REQUIRED_BRANCH"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test with coverage gate
        run: >
          uv run pytest
          --cov=butterbot
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=70

      - name: Check critical module coverage
        run: uv run python scripts/check_critical_coverage.py coverage.json

      - name: Build distributions
        run: uv build

      - name: Smoke test wheel
        shell: bash
        run: |
          uv venv .smoke-venv --python "3.12"
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      - name: Smoke test adapter extras
        shell: bash
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          for extra in napcat bilibili all; do
            extra_env=".extra-${extra}-venv"
            uv venv "$extra_env" --python "3.12"
            uv pip install \
              --python "$extra_env/bin/python" \
              "${wheel_path}[${extra}]"
            "$extra_env/bin/python" scripts/smoke_extra.py "$extra"
          done

      - name: Build external plugin contract fixtures
        shell: bash
        run: |
          mkdir -p plugin-dist
          uv build tests/fixtures/plugins/handler_only --out-dir plugin-dist

      - name: Smoke test external plugin wheels
        shell: bash
        run: |
          uv pip install \
            --python .smoke-venv/bin/python \
            plugin-dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_plugins.py"

      - name: Smoke test local directory handler plugins
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          PYTHONDONTWRITEBYTECODE=1 \
            "$GITHUB_WORKSPACE/.smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_local_plugins.py"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          RELEASE_ARGS=(
            --title "$TAG_NAME"
            --generate-notes
            --verify-tag
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          else
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "$TAG_NAME" dist/* "${RELEASE_ARGS[@]}"
