name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev --python "3.12"

      - name: Validate tag and branch
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          git fetch origin main dev_main --prune

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            REQUIRED_BRANCH="main"
            PRERELEASE="false"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            CHANNEL="dev"
            REQUIRED_BRANCH="dev_main"
            PRERELEASE="true"
          else
            echo "Invalid tag: $TAG"
            echo "Expected stable tag: v3.0.5"
            echo "Expected dev tag: v3.0.5-dev.1"
            exit 1
          fi

          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/${REQUIRED_BRANCH}$"; then
            echo "Tag $TAG is not on required branch: $REQUIRED_BRANCH"
            exit 1
          fi

          PROJECT_VERSION="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${TAG#v}"
          BASE_VERSION="${TAG_VERSION%%-dev.*}"
          if [[ "$BASE_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag version $BASE_VERSION does not match project version $PROJECT_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test with coverage gate
        run: >
          uv run pytest
          --cov=butter_bot
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Build distributions
        run: uv build

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          RELEASE_ARGS=(
            --title "$TAG_NAME"
            --generate-notes
            --verify-tag
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          else
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "$TAG_NAME" dist/* "${RELEASE_ARGS[@]}"
