name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Build and validate documentation
        run: npm run docs:check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run pyright

      - name: Test with coverage gate
        if: matrix.python-version == '3.12'
        run: >
          uv run pytest
          --cov=butterbot
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Test
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Smoke test wheel
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          uv venv .smoke-venv --python "${{ matrix.python-version }}"
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
