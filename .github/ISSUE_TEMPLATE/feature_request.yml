name: 功能建议
description: 提议新的框架能力、公共 API 或开发体验改进
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        请先描述需要解决的问题，再说明建议方案。插件、Source 和 core 的依赖边界应保持清晰。

  - type: dropdown
    id: area
    attributes:
      label: 建议范围
      options:
        - BotApp 与生命周期
        - CLI 与进程管理
        - RuntimeConfig 与配置
        - EventBus 与 Handler
        - Plugin
        - Source 或 API 扩展契约
        - NapCat
        - Bilibili
        - 安装、构建或打包
        - 文档与示例
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流的限制、受影响的使用场景，以及为什么现有 API 不足以解决。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、调用方式和生命周期所有权；可以附上简短 API 草图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 说明已有 workaround、其他设计及其取舍。

  - type: textarea
    id: compatibility
    attributes:
      label: API、配置与兼容性影响
      description: 说明是否涉及公开导出、签名、YAML、异常、异步生命周期或 breaking change。

  - type: textarea
    id: verification
    attributes:
      label: 建议的验证方式
      description: 列出适合覆盖该能力的单元测试、失败回滚、取消、超时或 smoke 场景。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索现有 Issue 和文档，未发现相同建议。
          required: true
        - label: 该建议保持 core 不依赖 app、CLI 或具体 Source 实现。
          required: true
        - label: 如果涉及异步资源，我已经说明创建者和关闭责任。
          required: true
