# ==============================
# ButterBot 配置文件示例
# ==============================
#
# 使用方法:
#   1. 在仓库根目录运行: cp examples/config.example.yaml config.yaml
#   2. 填入你的配置信息
#   3. 在代码中使用:
#      from butterbot.app import RuntimeConfig
#      config = RuntimeConfig.from_yaml()
#

# ---------- 当前配置使用的环境变量默认值 ----------
# 当前进程中的同名环境变量优先；这里的值只参与配置加载，不会写入 os.environ。
environment:
  BILI_SESSDATA: ""
  BILI_JCT: ""
  BILI_BUVID3: ""
  NAPCAT_URL: "ws://localhost:3001"
  NAPCAT_TOKEN: ""

# ---------- 实验插件（默认关闭） ----------
# 只列出明确可信的 entry point 或 ./plugins 本地候选。
plugins:
  enabled: []
  # 启用 examples/plugins/manager_example 时，把上一行替换为:
  # enabled:
  #   - example.bilibili-manager
  # local:
  #   path: "./examples/plugins" # 相对 config.yaml 所在目录
  #   auto_enable: false # 默认只索引 manifest，不执行未启用代码
  # config:
  #   example.bilibili-manager:
  #     config_key: bili_account

# ---------- 命名 Source 配置 ----------
# 自定义键（bili_account/qq_account）是运行时 config_key。
# source_name 选择内置配置 builder；kwarg 中出现的类由 BotApp 自动创建并注册。
# 请只保留应用实际使用的 Source 类，避免启动不需要的连接。
sources:
  # bilibili_api.Credential 参数，不填则为未登录状态
  bili_account:
    source_name: bilibili
    kwarg:
      BiliDanmakuSource:
        room_id: [26498147, 22758221]
      # manager_example 插件需要以下两个 Source:
      # BiliDynamicSource:
      #   watch_targets: [1802011210]
      #   poll_interval: 100
      # BiliLiveSource:
      #   watch_targets: [22758221]
      #   poll_interval: 100
    sessdata: "${BILI_SESSDATA}"
    bili_jct: "${BILI_JCT}"
    buvid3: "${BILI_BUVID3}"
    # dedeuserid: ""
    # ac_time_value: ""

  # NapcatConfig 参数
  qq_account:
    source_name: napcat
    kwarg:
      NapcatSource: {}
    url: "${NAPCAT_URL}"
    token: "${NAPCAT_TOKEN}"
    # heartbeat: 30.0
    # reconnect_attempts: 5
    # receive_timeout: 60.0

# 也可以直接用分层环境变量覆盖字段，例如:
# BUTTERBOT__SOURCES__QQ_ACCOUNT__TOKEN=secret
# BUTTERBOT__SOURCES__BILI_ACCOUNT__KWARG__BILIDANMAKUSOURCE__ROOM_ID='[1, 2]'
